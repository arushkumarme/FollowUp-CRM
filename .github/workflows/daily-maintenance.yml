
name: Daily Repository Maintenance

on:
  schedule:
    - cron: "37 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-repository-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Record daily repository health
        shell: bash
        env:
          COMMIT_EMAIL: ${{ vars.GIT_COMMIT_EMAIL }}
        run: |
          set -o pipefail

          if [[ -z "${COMMIT_EMAIL:-}" ]]; then
            echo "::error::Set GIT_COMMIT_EMAIL in repository Actions variables."
            exit 1
          fi

          DATE="$(TZ=Asia/Kolkata date +'%Y-%m-%d')"
          RUN_TIME="$(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M:%S %Z')"
          COMMIT_TIME="$(TZ=Asia/Kolkata date --iso-8601=seconds)"
          FILE="daily-maintenance/${DATE}.md"

          mkdir -p daily-maintenance

          README_STATUS="MISSING"
          APP_STATUS="NOT PRESENT"
          [[ -f README.md ]] && README_STATUS="PRESENT"
          [[ -f src/app/page.tsx ]] && APP_STATUS="PRESENT"

          INSTALL_STATUS="NOT RUN"
          LINT_STATUS="NOT RUN"
          TYPECHECK_STATUS="NOT RUN"

          if [[ -f package.json && -f package-lock.json ]]; then
            if npm ci --no-audit --no-fund; then
              INSTALL_STATUS="PASS"

              if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
                if npm run lint; then
                  LINT_STATUS="PASS"
                else
                  LINT_STATUS="FAIL"
                fi
              else
                LINT_STATUS="SKIPPED — no lint script"
              fi

              if [[ -x node_modules/.bin/tsc ]]; then
                if ./node_modules/.bin/tsc --noEmit; then
                  TYPECHECK_STATUS="PASS"
                else
                  TYPECHECK_STATUS="FAIL"
                fi
              else
                TYPECHECK_STATUS="SKIPPED — TypeScript unavailable"
              fi
            else
              INSTALL_STATUS="FAIL"
              LINT_STATUS="SKIPPED — install failed"
              TYPECHECK_STATUS="SKIPPED — install failed"
            fi
          else
            INSTALL_STATUS="SKIPPED — application dependencies not available"
            LINT_STATUS="SKIPPED — application not initialized"
            TYPECHECK_STATUS="SKIPPED — application not initialized"
          fi

          cat > "$FILE" <<EOF
          # Daily Repository Health — ${DATE}

          - Run time: ${RUN_TIME}
          - README: ${README_STATUS}
          - Application page: ${APP_STATUS}
          - Dependency installation: ${INSTALL_STATUS}
          - Lint: ${LINT_STATUS}
          - TypeScript check: ${TYPECHECK_STATUS}

          This report was automatically generated by GitHub Actions.
          It records repository maintenance, not manual coding activity.
          EOF

          git config user.name "arushkumarme"
          git config user.email "$COMMIT_EMAIL"

          git add "$FILE"

          git -c "user.name=arushkumarme" \
              -c "user.email=$COMMIT_EMAIL" \
              commit \
              --date="$COMMIT_TIME" \
              -m "chore: daily repository maintenance (${DATE})"

          git push origin HEAD:main
